version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "superset"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset:
    image: apache/superset:4.1.3
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=thisISaSECRET_1234_change_ME
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://superset:superset@db:5432/superset
      - ENABLE_PROXY_FIX=true
      - MAPBOX_API_KEY=
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_CONFIG=CeleryRedisConfig(celery_redis_url=redis://redis:6379/0)
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - superset_home:/app/superset_home
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  db-data:
  superset_home:
  redis-data:
